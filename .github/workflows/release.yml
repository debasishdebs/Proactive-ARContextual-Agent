name: Release

# DRAFT of the PCA release-signing pipeline (planned for after Sri Lanka, 1.3.0 lineage). Not yet exercised.
# Builds the RELEASE variants, signs them with the release key (+ rotation lineage), checks the signer against
# the pin in release/signer-sha256.txt, and creates a DRAFT GitHub release. Publishing is always manual.
# Never debug-signed. Setup and secrets: release/README.md.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag the draft is created for (e.g. v1.3.0). The tag is only created when you publish the draft."
        required: true
      with_bridge:
        description: "Also build and sign :nexus-bridge"
        type: boolean
        default: false

permissions:
  contents: write # creating the DRAFT release; nothing else is granted

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  BUILD_TOOLS_VERSION: "36.0.0"

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out (full history, for the previous tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Locate build-tools and check the pin is filled in
        run: |
          set -euo pipefail
          bt="$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION"
          [ -x "$bt/apksigner" ] || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS_VERSION" > /dev/null
          echo "BT=$bt" >> "$GITHUB_ENV"
          pin=$(grep -v '^[[:space:]]*#' release/signer-sha256.txt | tr -d '[:space:]' | tr 'A-F' 'a-f')
          printf '%s' "$pin" | grep -Eq '^[0-9a-f]{64}$' || { echo "::error::release/signer-sha256.txt is still a placeholder"; exit 1; }
          echo "PIN=$pin" >> "$GITHUB_ENV"

      - name: Fail if versionCode is not greater than the previous tag's
        run: |
          set -euo pipefail
          vc() { sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' | head -n1; }
          prev=$(git tag --list 'v*' --sort=-v:refname | grep -vx "$TAG" | head -n1 || true)
          if [ -z "$prev" ]; then echo "No previous v* tag: versionCode check skipped (first release)."; exit 0; fi
          mods="phone glasses"; [ "${{ inputs.with_bridge }}" = "true" ] && mods="$mods nexus-bridge"
          for m in $mods; do
            now=$(vc < "android-companion/$m/build.gradle.kts")
            before=$(git show "$prev:android-companion/$m/build.gradle.kts" | vc)
            echo "$m: versionCode $now (previous tag $prev: $before)"
            [ "$now" -gt "$before" ] || { echo "::error::$m versionCode $now is not greater than $before at $prev"; exit 1; }
          done

      # Release variants only. The unsigned APKs come out of AGP; no signingConfig is set in Gradle, so the debug
      # key is never applied.
      - name: Build the release variants (unsigned)
        working-directory: android-companion
        run: |
          set -euo pipefail
          tasks=":phone:assembleRelease :glasses:assembleRelease"
          [ "${{ inputs.with_bridge }}" = "true" ] && tasks="$tasks :nexus-bridge:assembleRelease"
          ./gradlew --no-daemon $tasks

      - name: Decode the release key and lineage outside the checkout
        env:
          KS_B64: ${{ secrets.PCA_RELEASE_KEYSTORE_B64 }}
          LINEAGE_B64: ${{ secrets.PCA_LINEAGE_B64 }}
          KS_PASS: ${{ secrets.PCA_RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PCA_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for n in KS_B64 LINEAGE_B64 KS_PASS KS_ALIAS; do
            [ -n "${!n}" ] || { echo "::error::a release signing secret behind $n is not configured"; exit 1; }
          done
          umask 077
          printf '%s' "$KS_B64" | base64 --decode > "$RUNNER_TEMP/pca-release.p12"
          printf '%s' "$LINEAGE_B64" | base64 --decode > "$RUNNER_TEMP/pca.lineage"

      # Single signer = the NEW key, with the lineage whose tail is that key. The rehearsal signed with the debug key
      # as first signer and --next-signer for the release key; CI never holds the debug key, so this is the lineage-only
      # form. Rehearse THIS form once on an emulator before the first real release (release/README.md).
      - name: Sign, verify, and pin-check
        env:
          KS_PASS: ${{ secrets.PCA_RELEASE_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.PCA_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/signed"; mkdir -p "$out"
          sign() { # <unsigned apk> <final name>
            "$BT/zipalign" -c -P 16 4 "$1" || "$BT/zipalign" -c 4 "$1"
            "$BT/apksigner" sign \
              --ks "$RUNNER_TEMP/pca-release.p12" --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS \
              --lineage "$RUNNER_TEMP/pca.lineage" --rotation-min-sdk-version 28 \
              --out "$out/$2" "$1"
          }
          pick() { # <dir> -> the single *.apk in it
            mapfile -t f < <(find "$1" -maxdepth 1 -type f -name '*.apk')
            [ "${#f[@]}" -eq 1 ] || { echo "::error::expected one apk in $1, found ${#f[@]}" >&2; exit 1; }
            printf '%s' "${f[0]}"
          }
          v="${TAG#v}"
          sign "$(pick android-companion/phone/build/outputs/apk/release)" "pca-phone-$v.apk"
          sign "$(pick android-companion/glasses/build/outputs/apk/release)" "pca-glasses-$v.apk"
          if [ "${{ inputs.with_bridge }}" = "true" ]; then
            sign "$(pick android-companion/nexus-bridge/build/outputs/apk/release)" "pca-nexus-bridge-$v.apk"
          fi
          for apk in "$out"/*.apk; do
            "$BT/apksigner" verify -v --print-certs "$apk" > "$RUNNER_TEMP/certs.txt"
            digests=$(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt" | tr 'A-F' 'a-f')
            [ "$(printf '%s\n' "$digests" | grep -c .)" = 1 ] || { echo "::error::$apk: not exactly one signer"; exit 1; }
            [ "$digests" = "$PIN" ] || { echo "::error::$apk is not signed by the pinned release key"; exit 1; }
            case "$digests" in 61a831*) echo "::error::$apk is signed by the debug key"; exit 1 ;; esac
            grep -q 'Verified using v3 scheme (APK Signature Scheme v3): true' "$RUNNER_TEMP/certs.txt" || { echo "::error::$apk has no v3 signature"; exit 1; }
            if grep -q 'Verified using v3.1 scheme (APK Signature Scheme v3.1): true' "$RUNNER_TEMP/certs.txt"; then
              echo "::error::$apk has a v3.1 block (missing --rotation-min-sdk-version)"; exit 1
            fi
            if "$BT/aapt2" dump badging "$apk" | grep -q 'application-debuggable'; then
              echo "::error::$apk is debuggable"; exit 1
            fi
            echo "$apk ok: $("$BT/aapt2" dump badging "$apk" | sed -n "s/^package: \(name='[^']*' versionCode='[0-9]*'\).*/\1/p")"
          done
          echo "OUT=$out" >> "$GITHUB_ENV"

      - name: Remove the decoded key material
        if: always()
        run: rm -f "$RUNNER_TEMP/pca-release.p12" "$RUNNER_TEMP/pca.lineage"

      - name: Provenance (SHA256SUMS)
        run: |
          set -euo pipefail
          cd "$OUT"
          {
            echo "# commit $GITHUB_SHA  tag $TAG  run $GITHUB_RUN_ID  signer-sha256 $PIN"
          } > PROVENANCE.txt
          sha256sum -- *.apk > SHA256SUMS
          cat SHA256SUMS

      - name: Create the DRAFT release (publishing is manual)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$OUT"/*.apk "$OUT/SHA256SUMS" "$OUT/PROVENANCE.txt" \
            --draft --target "$GITHUB_SHA" --title "PCA ${TAG#v} (draft)" \
            --notes "Draft built by CI from $GITHUB_SHA. Verify with release/verify-release.sh, then publish by hand."
